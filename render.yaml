services:
  - type: worker
    name: 34forfree7-telegram-bot
    runtime: node
    rootDir: bot
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_TELEGRAM_USER_IDS
        sync: false
      - key: TELEGRAM_WORKSPACE_ASSIGNMENTS
        sync: false
      - key: ADMIN_CHAT_IDS
        sync: false
      - key: CABINET_URL
        value: https://client-cabinet.vercel.app
